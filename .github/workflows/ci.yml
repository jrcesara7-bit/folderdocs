name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  nav:
    name: nav.json files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-nav.mjs
      - name: Check for changes
        run: |
          if ! git diff --exit-code -- 'docs*/nav.json'; then
            echo "::error::A menu is out of date. Run 'npm run nav' and commit the nav.json files."
            exit 1
          fi
