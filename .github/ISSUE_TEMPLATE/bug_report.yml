name: Report a bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: Concrete steps. If possible, include the `.md` file or the folder structure that triggers it.
      placeholder: |
        1. Create docs/x/y.md with…
        2. Open #/x/y
        3. See…
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 130, Chrome 128, Safari 17…
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v`. Leave empty if the problem already shows up on a published site.
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      description: Open the developer tools (F12 → Console) and paste whatever appears.
      render: shell
