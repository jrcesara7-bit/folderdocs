name: Suggest an improvement
description: An idea for folderdocs
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        folderdocs aims to stay small and dependency-free. Proposals that respect that are easier to accept.
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What do you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
