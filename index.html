<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>folderdocs: Markdown documentation, no build step</title>
  <meta name="description" content="folderdocs is a static Markdown documentation template: no build step, no dependencies, an automatic menu generated from your folders, search and light/dark themes. Ready for GitHub Pages.">
  <meta name="theme-color" content="#25282c">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <!-- When you publish your site, change these URLs to your own domain -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="folderdocs: Markdown documentation, no build step">
  <meta property="og:description" content="Write .md files and get a documentation site with an automatic menu, search and light/dark themes. No build step.">
  <meta property="og:url" content="https://jrcesara7-bit.github.io/folderdocs/">
  <meta property="og:image" content="https://jrcesara7-bit.github.io/folderdocs/assets/img/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="assets/css/theme.css">
  <script>
    // Apply the saved theme before painting to avoid a flash.
    try { var t = localStorage.getItem('docs-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menu-toggle" aria-label="Open menu">☰</button>
    <a class="topbar-title" href="#/" id="topbar-title">Documentation</a>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="#/" id="brand"></a>
        <div class="search">
          <input id="search" type="search" placeholder="Search the docs" autocomplete="off" aria-label="Search">
        </div>
      </div>
      <div class="sidebar-body">
        <nav id="nav" aria-label="Contents"></nav>
        <div id="results" class="results" hidden></div>
      </div>
      <div class="sidebar-foot">
        <span><span id="foot-label"></span> <span id="lang-switch" class="lang-switch"></span></span>
        <button class="theme-btn" id="theme-toggle" aria-label="Toggle theme">☾ / ☀</button>
      </div>
    </aside>

    <main class="content" id="content">
      <div class="content-head">
        <div>
          <div class="site-subtitle" id="site-subtitle"></div>
          <ol class="breadcrumb" id="breadcrumb"></ol>
        </div>
        <div class="head-links" id="head-links"></div>
      </div>
      <article class="doc" id="doc" aria-live="polite"><noscript>This documentation needs JavaScript to display its content.</noscript></article>
      <footer class="pager" id="pager"></footer>
      <div class="site-footer" id="site-footer"></div>
    </main>
  </div>
  <div class="backdrop" id="backdrop"></div>

  <script src="assets/vendor/marked.umd.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
